name: golangci-lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libvirt build deps
        run: sudo apt-get update && sudo apt-get install -y libvirt-dev gcc pkg-config
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m ./storagePool/ ./utilities/ ./cmd/testserver/... ./examples/...
          install-mode: binary
